<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#F4F6F1" />
  <title>健身记录</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <!-- 图标库：方向 B 线性图标（供 tab 与页面内联使用） -->
  <svg width="0" height="0" class="svg-defs" aria-hidden="true" focusable="false">
    <defs>
      <symbol id="i-dumbbell" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5v11M4 8.5v7M9 8.5v7M6.5 12H17.5M15 8.5v7M20 8.5v7M17.5 6.5v11"/></symbol>
      <symbol id="i-cal" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></symbol>
      <symbol id="i-list" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></symbol>
      <symbol id="i-chart" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 12.5l2.5 2.5 4.5-5"/></symbol>
      <symbol id="i-flame" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c1 3-1.5 5-3 7-1.8 2.4-.5 6 .5 7.5C11 20.5 13 21 15 20c2.5-1.2 3.5-4 3-6.5-.4-2-1-3.5-2-5 0 0-1 2-2 2S12 3 12 3Z"/></symbol>
    </defs>
  </svg>

  <div id="app"></div>

  <nav id="tabs" hidden>
    <button type="button" data-tab="today">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-dumbbell" /></svg>
      <span>今天</span>
    </button>
    <button type="button" data-tab="plan">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-cal" /></svg>
      <span>计划</span>
    </button>
    <button type="button" data-tab="history">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-list" /></svg>
      <span>记录</span>
    </button>
    <button type="button" data-tab="charts">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-chart" /></svg>
      <span>图表</span>
    </button>
    <button type="button" data-tab="checkin">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-check" /></svg>
      <span>打卡</span>
    </button>
  </nav>

  <script src="/app.js"></script>
</body>
</html>
